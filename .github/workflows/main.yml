
name: Build and Publish .NET Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./Lab14_AlvaradoPiero/Lab14_AlvaradoPiero.csproj

      - name: Build application
        run: dotnet build ./Lab14_AlvaradoPiero/Lab14_AlvaradoPiero.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish ./Lab14_AlvaradoPiero/Lab14_AlvaradoPiero.csproj --configuration Release --output ./published

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: published-application
          path: published/
